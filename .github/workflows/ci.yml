name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Match the previously verified repo CI runtime and avoid runner-default drift.
          node-version: "22"
      - run: |
          corepack enable
          corepack prepare pnpm@10.4.1 --activate
      - run: pnpm install --frozen-lockfile
      - name: Type check
        run: pnpm check
      - name: Tests
        run: pnpm test
      - name: Build
        run: pnpm build
